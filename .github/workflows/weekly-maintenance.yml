name: Weekly maintenance

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh versions of GitHub-released apps
        run: python3 scripts/refresh_versions.py

      - name: Link-check all published downloads
        run: python3 scripts/check_links.py _downloads linkcheck-report.tsv || true

      - name: Upload link report
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-report
          path: linkcheck-report.tsv
          retention-days: 30

      - name: Commit version updates
        run: |
          git config user.name "filehoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _downloads
          if git diff --cached --quiet; then
            echo "No version changes this week."
          else
            git commit -m "Weekly maintenance: refresh app versions"
            git push
          fi

<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: " en " }}">

{% include head.html %}

<body>
  <header class="container-fulied">
    {% include nav-top.html %}
  </header>
  <section class="container-fulied">
    <div class="row">
      <div class="col-sm-3 col-md-2 affix-sidebar">
        {% include nav-left.html %}
        {% if site.environment=="production" %}
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6932012645209598"
        crossorigin="anonymous"></script>
   <!-- left -->
   <ins class="adsbygoogle"
        style="display:inline-block;width:160px;height:600px"
        data-ad-client="ca-pub-6932012645209598"
        data-ad-slot="4776540219"></ins>
   <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
   </script>
        {% endif %}

      </div>
      <div class="col-sm-9 col-md-10 content" style="padding-left:0px;">
        {{content}}
      </div>
    </div>
  </section>
  <br>
  <footer class="container-fulied">
    {% include footer.html %}
  </footer>
  {% include lib.html %}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-109069515-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'UA-109069515-1');
  </script>

</body>

</html>

title: Filehoo
tagline: Free Software, Direct Downloads
baseurl: ""
domain-name: www.filehoo.com
url: https://www.filehoo.com
lang: en
description: >-
  Download free software fast. Every download on Filehoo links straight to the
  publisher's own file - no repacks, no bundled installers, no waiting pages.
author: filehoo
environment: production
permalink: pretty
markdown: kramdown
highlighter: rouge
img: /assets/img
changefreq: monthly
priority: 0.5

# Google Analytics 4
ga4_id: G-44WE3EYGFQ

# Build settings

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - node_modules
  - lib
  - CNAME
  - vendor
  - Gemfile
  - Gemfile.lock
  - scripts
  - portable
  - gulpfile.js
  - bower.json
  - package-lock.json
  - Adobe-PhotoShop-CS2.md

collections:
  guides:
    output: true
    permalink: /guides/:path/
  downloads:
    output: true
    permalink: /downloads/:path/
  categories:
    output: true
    permalink: /download-:path/
  tags:
    output: true
    permalink: /:path-downloads/
  letters:
    output: true
    permalink: /download-:path/

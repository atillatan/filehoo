{% if include.page.faq %}
<section class="faq-section">
  <h2>Frequently asked questions</h2>
  {% for item in include.page.faq %}
  <details class="faq-item"{% if forloop.first %} open{% endif %}>
    <summary>{{ item.q }}</summary>
    <p>{{ item.a }}</p>
  </details>
  {% endfor %}
</section>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in include.page.faq %}{ "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} } }{% unless forloop.last %},{% endunless %}
    {% endfor %}]
}
</script>
{% endif %}
